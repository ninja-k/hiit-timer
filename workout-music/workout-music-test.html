<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Music Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            padding: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .controls {
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            width: 300px;
        }
        #status {
            margin: 20px 0;
            padding: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            min-height: 20px;
            width: 80%;
            max-width: 500px;
            text-align: center;
        }
        canvas {
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #000;
        }
        #audioInitOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            flex-direction: column;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Workout Music Test</h1>
    <p>Test the fixed workout music implementation</p>
    
    <!-- Audio Initialization Overlay -->
    <div id="audioInitOverlay">
        <h2 style="margin-bottom: 20px;">Workout Music Player</h2>
        <p style="margin-bottom: 30px; max-width: 500px;">Click the button below to enable audio. Audio must be started by a user interaction due to browser autoplay policies.</p>
        <button id="initAudioBtn" style="padding: 15px 30px; font-size: 18px; border: none; border-radius: 5px; background: #4CAF50; color: white; cursor: pointer; transition: background 0.3s; margin-bottom: 20px;">
            Click to Enable Audio
        </button>
    </div>
    
    <div id="status">Ready to initialize</div>
    
    <div class="controls">
        <button id="testDrums">Test Drums</button>
        <button id="directDrumTest">Direct Drum Test</button>
        <button id="startWorkout">Start Workout</button>
        <button id="stopWorkout">Stop Workout</button>
    </div>
    
    <canvas id="audioVisualizer" width="600" height="200"></canvas>
    
    <script type="module">
        import { workoutMusic } from './js/workout-music-fixed-v2.js';
        
        // Get UI elements
        const testDrumsButton = document.getElementById('testDrums');
        const directDrumTestButton = document.getElementById('directDrumTest');
        const startWorkoutButton = document.getElementById('startWorkout');
        const stopWorkoutButton = document.getElementById('stopWorkout');
        const statusElement = document.getElementById('status');
        const audioVisualizer = document.getElementById('audioVisualizer');
        const audioInitOverlay = document.getElementById('audioInitOverlay');
        const initAudioBtn = document.getElementById('initAudioBtn');
        
        // Set up audio context and analyzer for visualization
        let analyser;
        let dataArray;
        let canvasCtx = audioVisualizer.getContext('2d');
        
        // Initialize audio context on user interaction
        initAudioBtn.addEventListener('click', async () => {
            try {
                await Tone.start();
                console.log('Audio context started');
                audioInitOverlay.style.display = 'none';
                setupAudioAnalyzer();
                updateStatus('Audio initialized. Ready to test.');
            } catch (error) {
                console.error('Could not start audio context:', error);
                updateStatus('Error initializing audio: ' + error.message);
            }
        });
        
        // Set up audio analyzer for visualization
        function setupAudioAnalyzer() {
            analyser = Tone.getContext().createAnalyser();
            analyser.fftSize = 2048;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            // Connect master output to analyzer
            Tone.getDestination().connect(analyser);
            
            // Start visualization
            visualize();
        }
        
        // Draw audio visualization
        function visualize() {
            requestAnimationFrame(visualize);
            
            if (!analyser) return;
            
            analyser.getByteTimeDomainData(dataArray);
            
            canvasCtx.fillStyle = 'rgb(0, 0, 0)';
            canvasCtx.fillRect(0, 0, audioVisualizer.width, audioVisualizer.height);
            
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = 'rgb(0, 255, 0)';
            canvasCtx.beginPath();
            
            const sliceWidth = audioVisualizer.width / dataArray.length;
            let x = 0;
            
            for (let i = 0; i < dataArray.length; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * audioVisualizer.height / 2;
                
                if (i === 0) {
                    canvasCtx.moveTo(x, y);
                } else {
                    canvasCtx.lineTo(x, y);
                }
                
                x += sliceWidth;
            }
            
            canvasCtx.lineTo(audioVisualizer.width, audioVisualizer.height / 2);
            canvasCtx.stroke();
        }
        
        // Update status
        function updateStatus(message) {
            statusElement.textContent = message;
            console.log(message);
        }
        
        // Test drums
        testDrumsButton.addEventListener('click', () => {
            updateStatus('Testing drums...');
            workoutMusic.testDrums();
            updateStatus('Drum test complete');
        });
        
        // Direct drum test (bypasses workoutMusic object)
        directDrumTestButton.addEventListener('click', async () => {
            updateStatus('Running direct drum test...');
            
            try {
                // Make sure audio context is running
                await Tone.start();
                console.log('Audio context started for direct test');
                
                // Create drums directly with the WORKING parameters
                const kick = new Tone.MembraneSynth({
                    pitchDecay: 0.05,
                    octaves: 5,
                    oscillator: { type: 'sine' },
                    envelope: {
                        attack: 0.001,
                        decay: 0.4,
                        sustain: 0.01,
                        release: 0.4  // Changed from 1.4 to 0.4
                    }
                }).toDestination();
                
                const snare = new Tone.NoiseSynth({
                    noise: { type: 'white' },
                    envelope: {
                        attack: 0.001,
                        decay: 0.2,
                        sustain: 0.02,
                        release: 0.2
                    }
                }).toDestination();
                
                const hihat = new Tone.MetalSynth({
                    frequency: 200,  // Changed from 800 to 200
                    envelope: {
                        attack: 0.001,
                        decay: 0.1,
                        release: 0.01  // Changed from 0.02 to 0.01
                    },
                    harmonicity: 5.1,
                    modulationIndex: 32,
                    resonance: 4000,
                    octaves: 1.5
                }).toDestination();
                
                // Play kick immediately
                console.log('Playing kick...');
                kick.triggerAttackRelease('C1', '16n');  // Changed from C2 to C1
                updateStatus('Playing kick drum...');
                
                // Play snare after 500ms
                setTimeout(() => {
                    console.log('Playing snare...');
                    snare.triggerAttackRelease('16n');
                    updateStatus('Playing snare drum...');
                }, 500);
                
                // Play hihat after 1000ms
                setTimeout(() => {
                    console.log('Playing hihat...');
                    hihat.triggerAttackRelease('16n');
                    updateStatus('Direct drum test complete');
                }, 1000);
                
            } catch (error) {
                console.error('Error in direct drum test:', error);
                updateStatus('Error in direct drum test: ' + error.message);
            }
        });
        
        // Start workout
        startWorkoutButton.addEventListener('click', async () => {
            updateStatus('Starting workout...');
            try {
                await workoutMusic.start();
                updateStatus('Workout started');
            } catch (error) {
                console.error('Error starting workout:', error);
                updateStatus('Error starting workout: ' + error.message);
            }
        });
        
        // Stop workout
        stopWorkoutButton.addEventListener('click', () => {
            updateStatus('Stopping workout...');
            workoutMusic.stop();
            updateStatus('Workout stopped');
        });
    </script>
</body>
</html>
