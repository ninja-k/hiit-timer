<!DOCTYPE html>
<html>
<head>
    <title>Generate Icons</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .canvas-container { margin: 20px 0; }
        canvas { border: 1px solid #ccc; margin: 5px; }
        button { padding: 10px 15px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Generate HIIT Timer Icons</h1>
    <p>Click "Generate Icons" to create placeholder icons for the extension.</p>
    
    <div class="canvas-container">
        <div><canvas id="icon16" width="16" height="16"></canvas> 16x16</div>
        <div><canvas id="icon48" width="48" height="48"></canvas> 48x48</div>
        <div><canvas id="icon128" width="128" height="128"></canvas> 128x128</div>
    </div>
    
    <button id="generate">Generate Icons</button>
    <button id="download">Download Icons</button>
    
    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#3498db');
            gradient.addColorStop(1, '#2ecc71');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Draw a simple stopwatch
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = size * 0.4;
            
            // Circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size * 0.05;
            ctx.stroke();
            
            // Add a simple 'HIIT' text for larger icons
            if (size >= 48) {
                ctx.font = `bold ${size * 0.25}px Arial`;
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('HIIT', centerX, centerY);
            }
        }
        
        function downloadIcons() {
            const sizes = [16, 48, 128];
            sizes.forEach(size => {
                const canvas = document.getElementById(`icon${size}`);
                const link = document.createElement('a');
                link.download = `icon${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
            alert('Icons downloaded! Place them in the icons/ folder.');
        }
        
        document.getElementById('generate').addEventListener('click', () => {
            drawIcon(document.getElementById('icon16'), 16);
            drawIcon(document.getElementById('icon48'), 48);
            drawIcon(document.getElementById('icon128'), 128);
        });
        
        document.getElementById('download').addEventListener('click', downloadIcons);
        
        // Draw initial preview
        window.onload = () => {
            document.getElementById('generate').click();
        };
    </script>
</body>
</html>
