<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Music Test V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .status {
            margin: 20px 0;
            padding: 10px;
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 5px;
            text-align: center;
        }
        .log-container {
            width: 100%;
            margin-top: 20px;
        }
        .log {
            width: 100%;
            height: 200px;
            padding: 10px;
            background-color: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: monospace;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Workout Music Test V2</h1>
        <p>This page tests the workout music system with improved drum handling</p>
        
        <div class="status" id="status">Ready to initialize</div>
        
        <div class="button-group">
            <button id="initAudio">Initialize Audio</button>
            <button id="testDrums" disabled>Test Drums</button>
            <button id="testKick" disabled>Test Kick</button>
            <button id="testSnare" disabled>Test Snare</button>
            <button id="testHihat" disabled>Test Hi-hat</button>
            <button id="startWorkout" disabled>Start Workout</button>
            <button id="stopWorkout" disabled>Stop Workout</button>
        </div>
        
        <div class="log-container">
            <h3>Log</h3>
            <div class="log" id="log"></div>
        </div>
    </div>
    
    <script>
        // Global variables
        let drums = null;
        let isPlaying = false;
        let audioInitialized = false;
        
        // UI elements
        const statusElement = document.getElementById('status');
        const logElement = document.getElementById('log');
        const initAudioButton = document.getElementById('initAudio');
        const testDrumsButton = document.getElementById('testDrums');
        const testKickButton = document.getElementById('testKick');
        const testSnareButton = document.getElementById('testSnare');
        const testHihatButton = document.getElementById('testHihat');
        const startWorkoutButton = document.getElementById('startWorkout');
        const stopWorkoutButton = document.getElementById('stopWorkout');
        
        // Helper functions
        function updateStatus(message) {
            statusElement.textContent = message;
            console.log(message);
            logMessage(message);
        }
        
        function logMessage(message) {
            const timestamp = new Date().toLocaleTimeString();
            logElement.innerHTML += `${timestamp}: ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        // Initialize audio
        initAudioButton.addEventListener('click', async () => {
            try {
                updateStatus('Initializing audio...');
                initAudioButton.disabled = true;
                
                // Start Tone.js
                await Tone.start();
                updateStatus('Audio context started, state: ' + Tone.context.state);
                
                // Initialize drums
                await initDrums();
                
                // Enable buttons
                testDrumsButton.disabled = false;
                testKickButton.disabled = false;
                testSnareButton.disabled = false;
                testHihatButton.disabled = false;
                startWorkoutButton.disabled = false;
                
                audioInitialized = true;
                updateStatus('Audio initialized successfully');
                
                // Play a test sound to confirm audio is working
                const testSynth = new Tone.Synth().toDestination();
                testSynth.volume.value = -12; // Lower volume
                testSynth.triggerAttackRelease('C5', '8n');
                logMessage('Played test tone C5');
                
                // Dispose of test synth after use
                setTimeout(() => testSynth.dispose(), 1000);
                
            } catch (error) {
                console.error('Error initializing audio:', error);
                updateStatus('Error: ' + error.message);
                initAudioButton.disabled = false;
                logMessage('ERROR: ' + error.message);
            }
        });
        
        // Initialize drums
        async function initDrums() {
            try {
                logMessage('Initializing drums...');
                
                // Create drums with the working parameters from minimal-drum-test.html
                drums = {
                    kick: new Tone.MembraneSynth({
                        pitchDecay: 0.05,
                        octaves: 5,
                        oscillator: { type: 'sine' },
                        envelope: {
                            attack: 0.001,
                            decay: 0.4,
                            sustain: 0.01,
                            release: 0.4
                        }
                    }),
                    
                    snare: new Tone.NoiseSynth({
                        noise: { type: 'white' },
                        envelope: {
                            attack: 0.001,
                            decay: 0.2,
                            sustain: 0.02,
                            release: 0.2
                        }
                    }),
                    
                    hihat: new Tone.MetalSynth({
                        frequency: 200,
                        envelope: {
                            attack: 0.001,
                            decay: 0.1,
                            release: 0.01
                        },
                        harmonicity: 5.1,
                        modulationIndex: 32,
                        resonance: 4000,
                        octaves: 1.5
                    })
                };
                
                // Connect to destination
                drums.kick.toDestination();
                drums.snare.toDestination();
                drums.hihat.toDestination();
                
                // Set volumes
                drums.kick.volume.value = 0;   // Full volume
                drums.snare.volume.value = -2; // Slightly reduced
                drums.hihat.volume.value = -6; // Reduced more
                
                logMessage('Drums initialized successfully');
                return true;
            } catch (error) {
                logMessage('ERROR initializing drums: ' + error.message);
                console.error('Error initializing drums:', error);
                return false;
            }
        }
        
        // Test all drums
        testDrumsButton.addEventListener('click', () => {
            if (!drums) {
                updateStatus('Drums not initialized');
                return;
            }
            
            updateStatus('Testing all drums...');
            
            try {
                const now = Tone.now();
                
                // Play kick immediately
                logMessage('Playing kick drum at pitch C1');
                drums.kick.triggerAttackRelease('C1', '16n', now);
                
                // Play snare after 200ms
                setTimeout(() => {
                    try {
                        const snareTime = Tone.now();
                        logMessage('Playing snare drum');
                        drums.snare.triggerAttackRelease('16n', snareTime);
                    } catch (e) {
                        logMessage('ERROR playing snare: ' + e.message);
                    }
                }, 200);
                
                // Play hi-hat after 400ms
                setTimeout(() => {
                    try {
                        const hihatTime = Tone.now();
                        logMessage('Playing hi-hat');
                        drums.hihat.triggerAttackRelease('16n', hihatTime);
                        updateStatus('All drums tested');
                    } catch (e) {
                        logMessage('ERROR playing hi-hat: ' + e.message);
                    }
                }, 400);
                
            } catch (error) {
                updateStatus('Error testing drums: ' + error.message);
                logMessage('ERROR testing drums: ' + error.message);
            }
        });
        
        // Test kick drum
        testKickButton.addEventListener('click', () => {
            if (!drums) {
                updateStatus('Kick drum not initialized');
                return;
            }
            
            updateStatus('Playing kick drum...');
            try {
                const now = Tone.now();
                drums.kick.triggerAttackRelease('C1', '16n', now);
                logMessage('Kick drum played at pitch C1');
            } catch (error) {
                updateStatus('Error playing kick: ' + error.message);
                logMessage('ERROR playing kick: ' + error.message);
            }
        });
        
        // Test snare drum
        testSnareButton.addEventListener('click', () => {
            if (!drums) {
                updateStatus('Snare drum not initialized');
                return;
            }
            
            updateStatus('Playing snare drum...');
            try {
                const now = Tone.now();
                drums.snare.triggerAttackRelease('16n', now);
                logMessage('Snare drum played');
            } catch (error) {
                updateStatus('Error playing snare: ' + error.message);
                logMessage('ERROR playing snare: ' + error.message);
            }
        });
        
        // Test hi-hat
        testHihatButton.addEventListener('click', () => {
            if (!drums) {
                updateStatus('Hi-hat not initialized');
                return;
            }
            
            updateStatus('Playing hi-hat...');
            try {
                const now = Tone.now();
                drums.hihat.triggerAttackRelease('16n', now);
                logMessage('Hi-hat played');
            } catch (error) {
                updateStatus('Error playing hi-hat: ' + error.message);
                logMessage('ERROR playing hi-hat: ' + error.message);
            }
        });
        
        // Start workout
        startWorkoutButton.addEventListener('click', async () => {
            if (isPlaying) {
                updateStatus('Already playing');
                return;
            }
            
            try {
                updateStatus('Starting workout...');
                
                // Make sure audio context is running
                if (Tone.context.state !== 'running') {
                    await Tone.context.resume();
                    logMessage('Audio context resumed, state: ' + Tone.context.state);
                }
                
                // Play a starting sound
                const synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.triggerAttackRelease(['C4', 'E4', 'G4'], '8n');
                
                // Set up a simple drum pattern
                const loop = new Tone.Loop((time) => {
                    // Play kick on beat 1
                    drums.kick.triggerAttackRelease('C1', '16n', time);
                    
                    // Play snare on beats 2 and 4
                    if (Tone.Transport.position.split(':')[1] % 4 === 2 || 
                        Tone.Transport.position.split(':')[1] % 4 === 0) {
                        drums.snare.triggerAttackRelease('16n', time);
                    }
                    
                    // Play hi-hat on every 8th note
                    if (Tone.Transport.position.split(':')[2] % 2 === 0) {
                        drums.hihat.triggerAttackRelease('16n', time);
                    }
                    
                    logMessage('Playing drum pattern at position: ' + Tone.Transport.position);
                }, '8n').start(0);
                
                // Start the transport
                Tone.Transport.bpm.value = 120;
                Tone.Transport.start();
                
                isPlaying = true;
                stopWorkoutButton.disabled = false;
                startWorkoutButton.disabled = true;
                
                updateStatus('Workout started');
                
            } catch (error) {
                updateStatus('Error starting workout: ' + error.message);
                logMessage('ERROR starting workout: ' + error.message);
            }
        });
        
        // Stop workout
        stopWorkoutButton.addEventListener('click', () => {
            if (!isPlaying) {
                updateStatus('Not playing');
                return;
            }
            
            try {
                updateStatus('Stopping workout...');
                
                // Stop the transport
                Tone.Transport.stop();
                Tone.Transport.cancel();
                
                // Play a stopping sound
                const synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.triggerAttackRelease(['G4', 'B4', 'D5'], '2n');
                
                isPlaying = false;
                stopWorkoutButton.disabled = true;
                startWorkoutButton.disabled = false;
                
                updateStatus('Workout stopped');
                
            } catch (error) {
                updateStatus('Error stopping workout: ' + error.message);
                logMessage('ERROR stopping workout: ' + error.message);
            }
        });
        
        // Log initial state
        logMessage('Page loaded. Click "Initialize Audio" to begin.');
    </script>
</body>
</html>
