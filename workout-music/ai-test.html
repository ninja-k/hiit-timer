<!DOCTYPE html>
<html>

<head>
    <title>HIIT Timer AI Test</title>
    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #chat-container {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            background: #f9f9f9;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }

        .message {
            margin: 5px 0;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            text-align: left;
        }

        .user-message {
            align-self: flex-end;
            background: #e3f2fd;
            margin-left: 20%;
        }

        .bot-message {
            align-self: flex-start;
            background: #f1f1f1;
            margin-right: 20%;
        }

        .typing {
            display: inline-block;
        }

        .typing::after {
            content: '|';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        #userInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        #sendButton {
            padding: 0 20px;
        }

        .status-bar {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }

        button:disabled {
            background: #cccccc;
        }

        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>HIIT Timer AI Assistant</h1>

        <!-- Quick Action Buttons -->
        <div class="button-group">
            <button id="getTip">Get Workout Tip</button>
            <button id="getExercise">Get Exercise</button>
            <button id="getMotivation">Motivate Me</button>
        </div>

        <!-- Chat Interface -->
        <div id="chat-container">
            <div class="message bot-message">Hello! I'm your HIIT assistant. Ask me anything about workouts, or use the buttons above for quick actions.</div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-container">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type your message here..." 
                autocomplete="off"
            >
            <button id="sendButton">Send</button>
        </div>

        <div class="status-bar">
            <p>Response time: <span id="time">-</span> seconds</p>
        </div>

        <script>
            // Global variables
            const chatContainer = document.getElementById('chat-container');
            const timeEl = document.getElementById('time');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            let isGenerating = false;

            // AIService class to handle AI generation
            class AIService {
                async generate(prompt) {
                    const startTime = performance.now();
                    try {
                        const response = await fetch('http://localhost:11434/api/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model: "phi",
                                prompt: prompt,
                                stream: false,
                                options: {
                                    temperature: 0.8,
                                    num_ctx: 128,
                                    num_predict: 10000,
                                    top_k: 20,
                                    top_p: 0.9,
                                    repeat_penalty: 1.1
                                }
                            })
                        });

                        if (!response.ok) throw new Error('Network response was not ok');
                        const data = await response.json();
                        
                        const endTime = performance.now();
                        return {
                            response: data.response.trim(),
                            time: ((endTime - startTime) / 1000).toFixed(2)
                        };
                    } catch (error) {
                        console.error('Error in generate:', error);
                        return { 
                            response: 'Sorry, I encountered an error. Please try again.', 
                            time: '0.00' 
                        };
                    }
                }
            }

            // Create AI service instance
            const aiService = new AIService();

            // Add message to chat
            function addMessage(role, text) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}-message`;
                messageDiv.textContent = text;
                chatContainer.appendChild(messageDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return messageDiv;
            }

            // Type text with animation
            async function typeText(element, text) {
                element.innerHTML = '';
                const words = text.split(' ');
                let currentText = '';
                
                for (let i = 0; i < words.length; i++) {
                    currentText += (i > 0 ? ' ' : '') + words[i];
                    element.textContent = currentText;
                    await new Promise(resolve => setTimeout(resolve, 30));
                }
                return currentText;
            }

            // Handle button clicks and AI responses
            async function handleButtonClick(prompt, userMessage = '') {
                if (isGenerating) return;
                
                isGenerating = true;
                
                // Add user message if provided
                if (userMessage) {
                    addMessage('user', userMessage);
                }
                
                // Add bot message with typing indicator
                const botMessage = addMessage('bot', '');
                const messageContainer = document.createElement('div');
                botMessage.innerHTML = '';
                botMessage.appendChild(messageContainer);
                messageContainer.innerHTML = '<span class="typing">Thinking...</span>';
                
                try {
                    const { response, time } = await aiService.generate(prompt);
                    
                    // Update time display
                    timeEl.textContent = time;
                    
                    // Type out the response
                    await typeText(messageContainer, response);
                    
                } catch (error) {
                    console.error('Error:', error);
                    messageContainer.textContent = 'Sorry, something went wrong. Please try again.';
                } finally {
                    isGenerating = false;
                }
            }

            // Handle sending a message from the input
            function handleSendMessage() {
                const message = userInput.value.trim();
                if (message && !isGenerating) {
                    // Clear input
                    userInput.value = '';
                    
                    // Generate response
                    handleButtonClick(
                        message,
                        message  // Show the user's message in the chat
                    );
                }
            }

            // Initialize the chat
            function initChat() {
                // Focus the input
                userInput.focus();
                
                // Send message on button click
                sendButton.addEventListener('click', handleSendMessage);
                
                // Send message on Enter key
                userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        handleSendMessage();
                    }
                });
                
                // Quick action button handlers
                document.getElementById('getTip').addEventListener('click', () => {
                    handleButtonClick(
                        "Give a short, practical HIIT workout tip (max 2 sentences):",
                        "💡 Give me a workout tip"
                    );
                });

                document.getElementById('getExercise').addEventListener('click', () => {
                    handleButtonClick(
                        "Suggest one HIIT exercise (just the name and 1-2 word description):",
                        "🏋️ Suggest an exercise"
                    );
                });

                document.getElementById('getMotivation').addEventListener('click', () => {
                    handleButtonClick(
                        "Give a short, energetic workout motivation (max 5 words):",
                        "🔥 Motivate me!"
                    );
                });
            }


            // Start the chat when the page loads
            window.addEventListener('DOMContentLoaded', initChat);
        </script>
    </body>
</html>
