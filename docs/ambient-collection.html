<!DOCTYPE html>
<html>
<head>
    <title>Ambient Collection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module">
        // Import the audio modules
        import * as dawnChorusModule from './assets/js/dawn-chorus-audio.js';
        import { forestAudio } from './assets/js/forest-whispers-audio.js';
        
        // Create a wrapper class for the forest audio to match the expected interface
        class ForestWhispersWrapper {
            constructor() {
                this.audio = forestAudio;
                this.initialized = false;
                this.controls = {
                    forestFloor: 0.7,
                    canopy: 0.6,
                    understory: 0.5
                };
                this.audioContextStarted = false;
            }
            
            async initialize() {
                if (!this.initialized) {
                    try {
                        await this.audio.initialize();
                        this.initialized = true;
                        // Set initial control values
                        this.updateControls();
                    } catch (error) {
                        console.error('Failed to initialize ForestWhispersAudio:', error);
                        throw error;
                    }
                }
                return this;
            }
            
            async start() {
                if (!this.initialized) {
                    await this.initialize();
                }
                // Ensure audio context is running
                if (Tone.context.state !== 'running') {
                    try {
                        await Tone.start();
                        this.audioContextStarted = true;
                    } catch (e) {
                        console.error('Error starting audio context in ForestWhispersWrapper:', e);
                        throw e;
                    }
                }
                
                // Start audio
                if (this.audio && typeof this.audio.start === 'function') {
                    await this.audio.start();
                }
                
                // Return the output for visualization
                return this;
            }
            
            // Define output getter for the visualizer
            get output() {
                return this.audio ? this.audio.output || this.audio.master : null;
            }
            
            stop() {
                try {
                    if (this.initialized) {
                        this.audio.stop();
                    }
                } catch (error) {
                    console.error('Error stopping ForestWhispersAudio:', error);
                }
            }
            
            // Control methods for the UI
            setForestFloor(level) {
                this.controls.forestFloor = level;
                this.updateControls();
            }
            
            setCanopy(level) {
                this.controls.canopy = level;
                this.updateControls();
            }
            
            setUnderstory(level) {
                this.controls.understory = level;
                this.updateControls();
            }
            
            // Update controls with current values
            updateControls() {
                if (this.initialized && this.audio.updateControls) {
                    this.audio.updateControls(this.controls);
                }
            }
            
            // For backward compatibility with old parameter names
            setWind(level) { this.setForestFloor(level); }
            setBirds(level) { this.setCanopy(level); }
            setLeaves(level) { this.setUnderstory(level); }
        }
        
        // Make the audio classes globally available
        window.DawnChorusAudio = dawnChorusModule.DawnChorusAudio || dawnChorusModule.default;
        window.ForestWhispersAudio = ForestWhispersWrapper;
        
        console.log('Audio modules loaded:', {
            DawnChorusAudio: typeof window.DawnChorusAudio === 'function',
            ForestWhispersAudio: typeof window.ForestWhispersAudio === 'function'
        });
        
        // Enable play buttons when modules are loaded
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.play-button').forEach(btn => {
                btn.disabled = false;
            });
        });
    </script>
    <style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="A collection of beautiful ambient soundscapes for relaxation and focus">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Ambient Collection</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ambient Collection</h1>
            <p class="subtitle">Immerse yourself in beautiful soundscapes</p>
            <p>Generative soundscapes for focus and relaxation</p>
        </header>
        
        <div class="collection" id="collection">
            <!-- Tracks will be added here dynamically -->
        </div>
    </div>

    <script>
        // Global audio context management
        let audioContextStarted = false;
        
        async function startAudioContext() {
            if (Tone.context.state !== 'running') {
                try {
                    await Tone.start();
                    console.log('Audio context started successfully');
                    audioContextStarted = true;
                    return true;
                } catch (e) {
                    console.error('Error starting audio context:', e);
                    return false;
                }
            }
            return true;
        }
        
        // Track collection data
        const tracks = [
            {
                id: 'garden',
                title: 'Ambient Garden',
                description: 'A generative ambient piece with evolving pads, gentle melodies, and organic textures. Perfect for relaxation and focus.',
                bpm: 72,
                duration: '∞',
                tags: ['generative', 'ambient', 'evolving'],
                init: initGardenTrack,
                initialized: false,
                instance: null
            },
            {
                id: 'dawn-chorus',
                title: 'Dawn Chorus',
                description: 'A peaceful morning soundscape with gentle bird songs and soft chimes, capturing the first light of day.',
                bpm: 68,
                duration: '∞',
                tags: ['nature', 'morning', 'peaceful'],
                init: initDawnChorusTrack,
                initialized: false,
                instance: null,
                controls: [
                    { id: 'birds', label: 'Birds', min: 0, max: 1, step: 0.1, value: 0.7 },
                    { id: 'chimes', label: 'Chimes', min: 0, max: 1, step: 0.1, value: 0.5 },
                    { id: 'pads', label: 'Pads', min: 0, max: 1, step: 0.1, value: 0.6 }
                ]
            },
            {
                id: 'forest-whispers',
                title: 'Forest Whispers',
                description: 'An immersive forest soundscape with rustling leaves, distant birds, and gentle wind through the trees.',
                bpm: 60,
                duration: '∞',
                tags: ['nature', 'forest', 'calming'],
                init: initForestWhispersTrack,
                initialized: false,
                instance: null,
                controls: [
                    { id: 'forestFloor', label: 'Forest Floor', min: 0, max: 1, step: 0.1, value: 0.7 },
                    { id: 'canopy', label: 'Canopy', min: 0, max: 1, step: 0.1, value: 0.6 },
                    { id: 'understory', label: 'Understory', min: 0, max: 1, step: 0.1, value: 0.5 }
                ]
            }
        ];
        
        // Current track state
        let currentTrack = null;
        let isPlaying = false;
        
        // Initialize the collection
        document.addEventListener('DOMContentLoaded', () => {
            const collectionEl = document.getElementById('collection');
            
            // Create track cards
            tracks.forEach(track => {
                const trackEl = document.createElement('div');
                // Add theme class based on track ID
                const themeClass = track.id === 'dawn-chorus' ? 'dawn-chorus' : 
                                 track.id === 'forest-whispers' ? 'forest-whispers' : '';
                trackEl.className = `track-card ${themeClass}`;
                trackEl.id = `track-${track.id}`;
                trackEl.innerHTML = `
                    <h3 class="track-title">${track.title}</h3>
                    <p class="track-description">${track.description}</p>
                    <div class="track-meta">
                        <span>BPM: ${track.bpm}</span> • 
                        <span>Duration: ${track.duration}</span>
                    </div>
                    <div class="controls">
                        <div class="control-buttons">
                            <button class="play-button" data-track="${track.id}">Play</button>
                            <button class="stop-button" data-track="${track.id}" disabled>Stop</button>
                        </div>
                        <div class="knob-container">
                        ${track.controls ? track.controls.map(control => `
                            <div class="knob">
                                <input type="range" class="knob-input" 
                                    id="${track.id}-${control.id}" 
                                    min="${control.min || 0}" 
                                    max="${control.max || 1}" 
                                    step="${control.step || 0.01}" 
                                    value="${control.value}" 
                                    data-param="${control.id}">
                                <label>${control.label}</label>
                            </div>
                        `).join('') : `
                            <div class="knob">
                                <input type="range" class="knob-input" id="${track.id}-ambience" min="0" max="1" step="0.01" value="0.7" data-param="ambience">
                                <label>Ambience</label>
                            </div>
                            <div class="knob">
                                <input type="range" class="knob-input" id="${track.id}-melody" min="0" max="1" step="0.01" value="0.5" data-param="melody">
                                <label>Melody</label>
                            </div>
                            <div class="knob">
                                <input type="range" class="knob-input" id="${track.id}-rhythm" min="0" max="1" step="0.01" value="0.3" data-param="rhythm">
                                <label>Rhythm</label>
                            </div>
                        `}
                    </div>
                    </div>
                    <div class="status"></div>
                    <div class="visualizer">
                        <canvas id="visualizer-${track.id}"></canvas>
                    </div>
                `;
                collectionEl.appendChild(trackEl);
                
                // Add event listeners
                trackEl.querySelector('.play-button').addEventListener('click', () => toggleTrack(track.id));
                trackEl.querySelector('.stop-button').addEventListener('click', stopTrack);
            });
            
            // Initialize audio context on first interaction
            document.body.addEventListener('click', async () => {
                if (Tone.context.state !== 'running') {
                    const contextStarted = await startAudioContext();
                    if (!contextStarted) {
                        console.error('Error starting audio context');
                    }
                }
            }, { once: true });
        });
        
        // Track control functions
        async function toggleTrack(trackId) {
            const track = tracks.find(t => t.id === trackId);
            if (!track) return;
            
            const trackEl = document.getElementById(`track-${trackId}`);
            const playButton = trackEl.querySelector('.play-button');
            const stopButton = trackEl.querySelector('.stop-button');
            const statusEl = trackEl.querySelector('.status');
            
            try {
                // If clicking the currently playing track, pause it
                if (currentTrack === trackId && isPlaying) {
                    playButton.textContent = 'Play';
                    statusEl.textContent = 'Paused';
                    
                    // Pause the current track
                    if (track.instance && track.instance.audio && typeof track.instance.audio.pause === 'function') {
                        await track.instance.audio.pause();
                    } else if (track.instance && track.instance.pause) {
                        await track.instance.pause();
                    }
                    
                    isPlaying = false;
                    return;
                }
                
                // If another track is playing, stop it first
                if (currentTrack && currentTrack !== trackId) {
                    await stopTrack();
                }
                
                // Update UI
                document.querySelectorAll('.track-card').forEach(el => {
                    el.classList.remove('now-playing');
                    const btn = el.querySelector('.play-button');
                    if (btn) btn.textContent = 'Play';
                });
                
                trackEl.classList.add('now-playing');
                playButton.textContent = 'Loading...';
                stopButton.disabled = false;
                statusEl.textContent = 'Initializing...';
                
                // Ensure audio context is running
                statusEl.textContent = 'Starting audio...';
                const contextStarted = await startAudioContext();
                if (!contextStarted) {
                    statusEl.textContent = 'Error: Could not start audio. Click to try again.';
                    playButton.textContent = 'Play';
                    stopButton.disabled = true;
                    return;
                }
                statusEl.textContent = 'Loading audio...';
                
                // Initialize the track if not already done
                if (!track.initialized) {
                    track.instance = await track.init(trackEl);
                    track.initialized = true;
                }
                
                // Start playback
                try {
                    if (track.instance) {
                        if (track.instance.audio && typeof track.instance.audio.start === 'function') {
                            await track.instance.audio.start();
                        } else if (track.instance.start) {
                            await track.instance.start();
                        }
                    }
                } catch (e) {
                    console.error('Error starting track:', e);
                    throw new Error('Could not start audio playback');
                }
                
                currentTrack = trackId;
                isPlaying = true;
                playButton.textContent = 'Pause';
                statusEl.textContent = 'Playing...';
                
            } catch (error) {
                console.error('Error in toggleTrack:', error);
                statusEl.textContent = 'Error: ' + (error.message || 'Unknown error');
                playButton.textContent = 'Play';
                stopButton.disabled = true;
            }
        }
        
        async function stopTrack() {
            if (!currentTrack) return;
            
            console.log(`Stopping track: ${currentTrack}`);
            
            // Get the track element and UI elements
            const trackEl = document.getElementById(`track-${currentTrack}`);
            if (!trackEl) {
                console.error('Track element not found');
                return;
            }
            
            const playButton = trackEl.querySelector('.play-button');
            const stopButton = trackEl.querySelector('.stop-button');
            const statusEl = trackEl.querySelector('.status');
            
            try {
                // Stop the track's audio instance if it exists
                const track = tracks.find(t => t.id === currentTrack);
                if (track && track.instance) {
                    // Call cleanup function if it exists (returned from track init)
                    if (typeof track.instance === 'function') {
                        await track.instance();
                    }
                    
                    // Stop audio
                    if (track.instance.audio && typeof track.instance.audio.stop === 'function') {
                        await track.instance.audio.stop();
                    } else if (track.instance.stop) {
                        await track.instance.stop();
                    }
                    
                    // Clean up visualizer
                    if (track.instance.visualizer) {
                        if (typeof track.instance.visualizer.stop === 'function') {
                            track.instance.visualizer.stop();
                        }
                        if (typeof track.instance.visualizer.cleanup === 'function') {
                            track.instance.visualizer.cleanup();
                        }
                    }
                    
                    // Delete the instance to force re-initialization on next play
                    track.initialized = false;
                    delete track.instance;
                }
                
                // Stop Tone.Transport if it's running
                if (Tone.Transport.state !== 'stopped') {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                }
                
                // Update UI
                if (playButton) playButton.textContent = 'Play';
                if (stopButton) stopButton.disabled = true;
                if (statusEl) statusEl.textContent = 'Stopped';
                
                trackEl.classList.remove('now-playing');
                console.log(`Successfully stopped track: ${currentTrack}`);
            } catch (error) {
                console.error(`Error stopping track ${currentTrack}:`, error);
                if (statusEl) statusEl.textContent = 'Error stopping';
            } finally {
                currentTrack = null;
                isPlaying = false;
            }
        }
        
        // Track implementations
        async function initGardenTrack(trackEl) {
            // Create audio nodes
            const padSynth = new Tone.PolySynth(Tone.Synth, {
                envelope: {
                    attack: 4,
                    decay: 0.5,
                    sustain: 0.5,
                    release: 8
                }
            });
            
            const padReverb = new Tone.Reverb({
                decay: 8,
                wet: 0.5
            });
            
            const melodySynth = new Tone.PolySynth(Tone.Synth, {
                envelope: {
                    attack: 0.1,
                    decay: 0.3,
                    sustain: 0.4,
                    release: 1
                },
                oscillator: {
                    type: 'triangle'
                }
            });
            
            const melodyDelay = new Tone.PingPongDelay({
                delayTime: '8n',
                feedback: 0.4,
                wet: 0.3
            });
            
            const rhythmSynth = new Tone.MetalSynth({
                frequency: 200,
                envelope: {
                    attack: 0.001,
                    decay: 0.1,
                    release: 0.5
                },
                harmonicity: 8.5,
                modulationIndex: 40,
                resonance: 300,
                octaves: 1.5
            });
            
            // Connect audio nodes
            padSynth.chain(padReverb, Tone.Destination);
            melodySynth.chain(melodyDelay, Tone.Destination);
            rhythmSynth.toDestination();
            
            // Set initial volumes
            padSynth.volume.value = Tone.gainToDb(0.7);
            melodySynth.volume.value = Tone.gainToDb(0.5);
            rhythmSynth.volume.value = Tone.gainToDb(0.3);
            
            // Connect knobs to parameters
            const ambienceKnob = trackEl.querySelector('[data-param="ambience"]');
            const melodyKnob = trackEl.querySelector('[data-param="melody"]');
            const rhythmKnob = trackEl.querySelector('[data-param="rhythm"]');
            
            ambienceKnob?.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                padSynth.volume.rampTo(Tone.gainToDb(value), 0.5);
            });
            
            melodyKnob?.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                melodySynth.volume.rampTo(Tone.gainToDb(value), 0.5);
            });
            
            rhythmKnob?.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                rhythmSynth.volume.rampTo(Tone.gainToDb(value), 0.5);
            });
            
            // Create chord progression for pads
            const chordProgression = [
                ['C4', 'E4', 'G4'],
                ['A3', 'C4', 'E4'],
                ['F3', 'A3', 'C4'],
                ['G3', 'B3', 'D4']
            ];
            
            // Create melody notes
            const melodyNotes = ['E4', 'G4', 'A4', 'B4', 'C5', 'D5', 'E5'];
            let chordIndex = 0;
            let melodyIndex = 0;
            
            // Create pad loop
            const padLoop = new Tone.Loop(time => {
                const chord = chordProgression[chordIndex];
                padSynth.triggerAttackRelease(chord, '2n', time, 0.5);
                chordIndex = (chordIndex + 1) % chordProgression.length;
            }, '2n');
            
            // Create melody loop
            const melodyLoop = new Tone.Loop(time => {
                if (Math.random() > 0.3) { // 70% chance to play a note
                    const note = melodyNotes[melodyIndex % melodyNotes.length];
                    melodySynth.triggerAttackRelease(note, '8n', time, Math.random() * 0.3);
                    melodyIndex++;
                }
            }, '4n');
            
            // Create rhythm loop
            const rhythmLoop = new Tone.Loop(time => {
                if (Math.random() > 0.5) { // 50% chance to play a rhythm hit
                    rhythmSynth.triggerAttackRelease('C3', '16n', time, Math.random() * 0.2);
                }
            }, '8n');
            
            // Start all loops
            padLoop.start(0);
            melodyLoop.start(0);
            rhythmLoop.start(0);
            
            // Store references for cleanup
            const loops = [padLoop, melodyLoop, rhythmLoop];
            const synths = [padSynth, melodySynth, rhythmSynth, padReverb, melodyDelay];
            
            // Set up visualization
            const canvas = trackEl.querySelector('canvas');
            const analyser = new Tone.Analyser('waveform', 256);
            padSynth.connect(analyser);
            
            const ctx = canvas.getContext('2d');
            let animationId;
            
            function draw() {
                animationId = requestAnimationFrame(draw);
                const values = analyser.getValue();
                
                ctx.fillStyle = 'rgba(26, 26, 46, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#a8e6cf';
                ctx.beginPath();
                
                const sliceWidth = canvas.width / values.length;
                let x = 0;
                
                for (let i = 0; i < values.length; i++) {
                    const v = values[i] * 100 + canvas.height / 2;
                    
                    if (i === 0) {
                        ctx.moveTo(x, v);
                    } else {
                        ctx.lineTo(x, v);
                    }
                    
                    x += sliceWidth;
                }
                
                ctx.stroke();
            }
            
            // Start visualization
            draw();
            
            // Set up transport
            Tone.Transport.bpm.value = 72;
            
            // Start audio context and transport
            await Tone.start();
            Tone.Transport.start();
            
            // Cleanup function
            return () => {
                // Stop all loops
                loops.forEach(loop => loop.stop());
                
                // Cancel animation
                cancelAnimationFrame(animationId);
                
                // Stop transport
                Tone.Transport.stop();
                Tone.Transport.cancel(); // Cancel all scheduled events
                
                // Dispose all synths and effects
                synths.forEach(node => {
                    try {
                        node.disconnect();
                        node.dispose();
                    } catch (e) {
                        console.warn('Error disposing node:', e);
                    }
                });
                
                // Dispose analyser
                try {
                    analyser.disconnect();
                    analyser.dispose();
                } catch (e) {
                    console.warn('Error disposing analyser:', e);
                }
            };
        }
        
        // Track initializers
        async function initDawnChorusTrack(trackEl) {
            if (!window.DawnChorusAudio) {
                throw new Error('Dawn Chorus audio module not loaded');
            }
            
            const statusEl = trackEl.querySelector('.status');
            statusEl.textContent = 'Initializing audio...';
            
            try {
                // Create audio engine
                const audio = new window.DawnChorusAudio();
                
                // Set up visualization
                const canvas = trackEl.querySelector('canvas');
                const analyser = new Tone.Analyser('waveform', 512);
                
                // Connect the audio output to the analyser
                try {
                    if (audio.mixer) {
                        audio.mixer.connect(analyser);
                        console.log('Connected Dawn Chorus mixer to analyser');
                    } else if (audio.padSynth) {
                        audio.padSynth.connect(analyser);
                        console.log('Connected Dawn Chorus padSynth to analyser');
                    } else {
                        console.warn('Could not connect Dawn Chorus audio to analyser');
                    }
                } catch (e) {
                    console.error('Error connecting Dawn Chorus to analyser:', e);
                }
                
                // Set up visualization
                const ctx = canvas.getContext('2d');
                let animationId;
                
                function draw() {
                    animationId = requestAnimationFrame(draw);
                    const values = analyser.getValue();
                    
                    // Clear canvas with dawn-themed gradient
                    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    gradient.addColorStop(0, 'rgba(15, 12, 41, 0.2)');
                    gradient.addColorStop(1, 'rgba(48, 43, 99, 0.2)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw waveform
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ff9d00';
                    ctx.beginPath();
                    
                    const sliceWidth = canvas.width / values.length;
                    let x = 0;
                    
                    for (let i = 0; i < values.length; i++) {
                        const v = values[i] * 100 + canvas.height / 2;
                        
                        if (i === 0) {
                            ctx.moveTo(x, v);
                        } else {
                            ctx.lineTo(x, v);
                        }
                        
                        x += sliceWidth;
                    }
                    
                    ctx.stroke();
                }
                
                // Start visualization
                draw();
                
                // Setup controls
                const controls = trackEl.querySelectorAll('.knob-input');
                controls.forEach(control => {
                    const param = control.dataset.param;
                    const initialValue = parseFloat(control.value) || 0.7;
                    
                    // Set initial values
                    audio.updateControls({ [param]: initialValue });
                    
                    // Add input event listener
                    control.addEventListener('input', (e) => {
                        if (!audio || !audio.updateControls) return;
                        
                        const value = parseFloat(e.target.value);
                        audio.updateControls({ [param]: value });
                    });
                });
                
                statusEl.textContent = 'Ready';
                
                return {
                    audio,
                    visualizer: {
                        cleanup: () => {
                            cancelAnimationFrame(animationId);
                            analyser.dispose();
                        }
                    }
                };
            } catch (error) {
                console.error('Error initializing Dawn Chorus:', error);
                statusEl.textContent = 'Error: ' + error.message;
                throw error;
            }
        }
        
        async function initForestWhispersTrack(trackEl) {
            const statusEl = trackEl.querySelector('.status');
            
            if (!window.ForestWhispersAudio) {
                const errorMsg = 'Forest Whispers audio module not loaded';
                console.error(errorMsg);
                statusEl.textContent = 'Error: Audio module not available';
                throw new Error(errorMsg);
            }
            
            try {
                statusEl.textContent = 'Initializing audio...';
                
                // Create a new instance of the audio
                const audio = new window.ForestWhispersAudio();
                
                // Initialize audio
                await audio.initialize();
                
                // Set up controls
                const controls = trackEl.querySelectorAll('.knob-input');
                controls.forEach(control => {
                    const param = control.dataset.param;
                    const initialValue = parseFloat(control.value) || 0.7;
                    
                    // Set initial audio levels
                    if (typeof audio[`${param}Level`] !== 'undefined') {
                        audio[`${param}Level`] = initialValue;
                    } else if (typeof audio[`set${param.charAt(0).toUpperCase() + param.slice(1)}`] === 'function') {
                        audio[`set${param.charAt(0).toUpperCase() + param.slice(1)}`](initialValue);
                    } else if (audio.updateControls) {
                        audio.updateControls({ [param]: initialValue });
                    }
                    
                    // Add input event listener
                    control.addEventListener('input', (e) => {
                        const value = parseFloat(e.target.value);
                        
                        // Update the audio parameter
                        const levelParam = `${param}Level`;
                        if (typeof audio[levelParam] !== 'undefined') {
                            audio[levelParam] = value;
                        } else if (typeof audio[`set${param.charAt(0).toUpperCase() + param.slice(1)}`] === 'function') {
                            audio[`set${param.charAt(0).toUpperCase() + param.slice(1)}`](value);
                        } else if (audio.updateControls) {
                            audio.updateControls({ [param]: value });
                        }
                    });
                });
                
                // Set up visualization
                const canvas = trackEl.querySelector('canvas');
                const analyser = new Tone.Analyser('waveform', 256);
                
                // Connect the audio output to the analyser
                try {
                    if (audio.output) {
                        audio.output.connect(analyser);
                        console.log('Connected audio output to analyser');
                    } else if (audio.audio && audio.audio.output) {
                        audio.audio.output.connect(analyser);
                        console.log('Connected audio.audio.output to analyser');
                    } else if (audio.master) {
                        audio.master.connect(analyser);
                        console.log('Connected audio master to analyser');
                    } else {
                        console.warn('Could not connect audio to analyser - no suitable output found');
                    }
                } catch (e) {
                    console.error('Error connecting to analyser:', e);
                }
                
                const ctx = canvas.getContext('2d');
                let animationId;
                
                function draw() {
                    animationId = requestAnimationFrame(draw);
                    const values = analyser.getValue();
                    
                    // Clear canvas with semi-transparent background for trail effect
                    ctx.fillStyle = 'rgba(26, 26, 46, 0.2)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw waveform
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#4a6bff';
                    ctx.beginPath();
                    
                    const sliceWidth = canvas.width / values.length;
                    let x = 0;
                    
                    for (let i = 0; i < values.length; i++) {
                        const v = values[i] * 100 + canvas.height / 2;
                        
                        if (i === 0) {
                            ctx.moveTo(x, v);
                        } else {
                            ctx.lineTo(x, v);
                        }
                        
                        x += sliceWidth;
                    }
                    
                    ctx.stroke();
                }
                
                // Start visualization
                draw();
                
                statusEl.textContent = 'Ready';
                
                // Return cleanup function
                return {
                    audio,
                    visualizer: {
                        cleanup: () => {
                            cancelAnimationFrame(animationId);
                            analyser.dispose();
                        }
                    }
                };
                
            } catch (error) {
                const errorMsg = `Failed to initialize audio: ${error.message}`;
                console.error(errorMsg, error);
                statusEl.textContent = 'Error: Audio initialization failed';
                throw error;
            }
        }
    </script>
