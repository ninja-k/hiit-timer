<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Music Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            padding: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .controls {
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            width: 300px;
        }
        #status {
            margin: 20px 0;
            padding: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            min-height: 20px;
            width: 80%;
            max-width: 500px;
            text-align: center;
        }
        .log {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 80%;
            max-width: 500px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Workout Music Test</h1>
    <p>Test the fixed workout music implementation</p>
    
    <div id="status">Ready to initialize</div>
    
    <div class="controls">
        <button id="initAudio">Initialize Audio</button>
        <button id="testDrums" disabled>Test Drums</button>
        <button id="directDrumTest" disabled>Direct Drum Test</button>
        <button id="startWorkout" disabled>Start Workout</button>
        <button id="stopWorkout" disabled>Stop Workout</button>
    </div>
    
    <div id="log" class="log"></div>
    
    <script type="module">
        import { workoutMusic } from './js/workout-music-fixed-v2.js';
        
        // Get UI elements
        const initButton = document.getElementById('initAudio');
        const testDrumsButton = document.getElementById('testDrums');
        const directDrumTestButton = document.getElementById('directDrumTest');
        const startWorkoutButton = document.getElementById('startWorkout');
        const stopWorkoutButton = document.getElementById('stopWorkout');
        const statusElement = document.getElementById('status');
        const logElement = document.getElementById('log');
        
        // Audio context and instruments
        let audioInitialized = false;
        let drums = null;
        
        // Update status
        function updateStatus(message) {
            statusElement.textContent = message;
            console.log(message);
            logMessage(message);
        }
        
        // Log message with timestamp
        function logMessage(message) {
            const timestamp = new Date().toLocaleTimeString();
            logElement.innerHTML += `${timestamp}: ${message}<br>`;
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        // Initialize audio
        initButton.addEventListener('click', async () => {
            try {
                updateStatus('Initializing audio...');
                initButton.disabled = true;
                
                // Start Tone.js context
                await Tone.start();
                updateStatus('Audio context started, state: ' + Tone.context.state);
                
                // Initialize workout music
                await workoutMusic.initializeOnInteraction();
                
                // Enable buttons
                testDrumsButton.disabled = false;
                directDrumTestButton.disabled = false;
                startWorkoutButton.disabled = false;
                
                audioInitialized = true;
                updateStatus('Audio initialized successfully');
                
            } catch (error) {
                console.error('Error initializing audio:', error);
                updateStatus('Error: ' + error.message);
                initButton.disabled = false;
                logMessage('ERROR: ' + error.message);
            }
        });
        
        // Test drums using workout music
        testDrumsButton.addEventListener('click', async () => {
            if (!audioInitialized) {
                updateStatus('Audio not initialized. Click Initialize Audio first.');
                return;
            }
            
            updateStatus('Testing drums...');
            try {
                await workoutMusic.testDrums();
                updateStatus('Drum test complete');
            } catch (error) {
                console.error('Error testing drums:', error);
                updateStatus('Error testing drums: ' + error.message);
                logMessage('ERROR testing drums: ' + error.message);
            }
        });
        
        // Direct drum test (bypasses workoutMusic object)
        directDrumTestButton.addEventListener('click', async () => {
            if (!audioInitialized) {
                updateStatus('Audio not initialized. Click Initialize Audio first.');
                return;
            }
            
            updateStatus('Running direct drum test...');
            
            try {
                // Make sure audio context is running
                if (Tone.context.state !== 'running') {
                    await Tone.start();
                }
                logMessage('Audio context state: ' + Tone.context.state);
                
                // Create drums directly with the WORKING parameters
                const kick = new Tone.MembraneSynth({
                    pitchDecay: 0.05,
                    octaves: 5,
                    oscillator: { type: 'sine' },
                    envelope: {
                        attack: 0.001,
                        decay: 0.4,
                        sustain: 0.01,
                        release: 0.4
                    }
                }).toDestination();
                
                const snare = new Tone.NoiseSynth({
                    noise: { type: 'white' },
                    envelope: {
                        attack: 0.001,
                        decay: 0.2,
                        sustain: 0.02,
                        release: 0.2
                    }
                }).toDestination();
                
                const hihat = new Tone.MetalSynth({
                    frequency: 200,
                    envelope: {
                        attack: 0.001,
                        decay: 0.1,
                        release: 0.01
                    },
                    harmonicity: 5.1,
                    modulationIndex: 32,
                    resonance: 4000,
                    octaves: 1.5
                }).toDestination();
                
                // Set volumes
                kick.volume.value = 0;   // Full volume
                snare.volume.value = -2; // Slightly reduced
                hihat.volume.value = -6; // Reduced more
                
                // Play kick immediately
                logMessage('Playing kick drum...');
                const now = Tone.now();
                kick.triggerAttackRelease('C1', '16n', now);
                updateStatus('Playing kick drum...');
                
                // Play snare after 500ms
                setTimeout(() => {
                    logMessage('Playing snare drum...');
                    snare.triggerAttackRelease('16n', Tone.now());
                    updateStatus('Playing snare drum...');
                }, 500);
                
                // Play hihat after 1000ms
                setTimeout(() => {
                    logMessage('Playing hi-hat...');
                    hihat.triggerAttackRelease('16n', Tone.now());
                    updateStatus('Direct drum test complete');
                }, 1000);
                
            } catch (error) {
                console.error('Error in direct drum test:', error);
                updateStatus('Error in direct drum test: ' + error.message);
                logMessage('ERROR in direct drum test: ' + error.message);
            }
        });
        
        // Start workout
        startWorkoutButton.addEventListener('click', async () => {
            if (!audioInitialized) {
                updateStatus('Audio not initialized. Click Initialize Audio first.');
                return;
            }
            
            updateStatus('Starting workout...');
            try {
                await workoutMusic.start();
                updateStatus('Workout started');
                startWorkoutButton.disabled = true;
                stopWorkoutButton.disabled = false;
            } catch (error) {
                console.error('Error starting workout:', error);
                updateStatus('Error starting workout: ' + error.message);
                logMessage('ERROR starting workout: ' + error.message);
            }
        });
        
        // Stop workout
        stopWorkoutButton.addEventListener('click', () => {
            updateStatus('Stopping workout...');
            try {
                workoutMusic.stop();
                updateStatus('Workout stopped');
                startWorkoutButton.disabled = false;
                stopWorkoutButton.disabled = true;
            } catch (error) {
                console.error('Error stopping workout:', error);
                updateStatus('Error stopping workout: ' + error.message);
                logMessage('ERROR stopping workout: ' + error.message);
            }
        });
        
        // Log initial state
        logMessage('Page loaded. Click "Initialize Audio" to begin.');
    </script>
</body>
</html>
